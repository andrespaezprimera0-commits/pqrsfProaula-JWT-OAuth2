<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Todas las Solicitudes</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="pagina">
    <div class="tarjeta tarjeta-ancha">
        <h1>Todas las solicitudes</h1>

        <p th:if="${#lists.isEmpty(solicitudes)}">Todavía no hay solicitudes registradas.</p>

        <table class="tabla" th:unless="${#lists.isEmpty(solicitudes)}">
            <thead>
            <tr>
                <th>Cliente</th>
                <th>Título</th>
                <th>Tipo</th>
                <th>Prioridad</th>
                <th>Estado</th>
                <th>Fecha</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${solicitudes}">
                <td th:text="${s.cliente != null ? s.cliente.nombre : '-'}"></td>
                <td>
                    <span th:text="${s.titulo}"></span>
                    <span th:if="${s.evidenciaIds != null and !#lists.isEmpty(s.evidenciaIds)}"
                          th:title="${#lists.size(s.evidenciaIds) + ' foto(s) de evidencia'}">📷</span>
                </td>
                <td th:text="${s.tipoSolicitud != null ? s.tipoSolicitud.nombre : '-'}"></td>
                <td th:text="${s.prioridad}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${s.estado == 'ABIERTA'} ? 'badge-abierta' : (${s.estado == 'CERRADA'} ? 'badge-cerrada' : 'badge-proceso')"
                          th:text="${s.estado}"></span>
                </td>
                <td th:text="${#dates.format(s.fechaCreacion, 'dd/MM/yyyy')}"></td>
                <td><a th:href="@{'/solicitudes/' + ${s.id} + '/gestionar'}" class="boton-link">Gestionar</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
